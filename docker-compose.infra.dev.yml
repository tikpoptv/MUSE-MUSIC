version: '3.8'

services:
  postgres:
    platform: linux/amd64
    image: postgres:16-alpine
    container_name: muse-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: muse_music
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "7770:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
      - ./backend/database/scripts/init-n8n-db.sh:/docker-entrypoint-initdb.d/init-n8n-db.sh
    networks:
      - muse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    platform: linux/amd64
    image: minio/minio:latest
    container_name: muse-minio-dev
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
      MINIO_DOMAIN: localhost
      MINIO_SERVER_URL: http://localhost:7771
      MINIO_BROWSER_REDIRECT_URL: http://localhost:7772
    ports:
      - "7771:9000"
      - "7772:9001"
    volumes:
      - minio_data:/data
    networks:
      - muse-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  n8n:
    platform: linux/amd64
    image: n8nio/n8n:latest
    container_name: muse-n8n-dev
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:7773/
      - GENERIC_TIMEZONE=Asia/Bangkok
      - N8N_ENCRYPTION_KEY=muse_music_n8n_key_2024
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres123
    ports:
      - "7773:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - muse-network

networks:
  muse-network:
    driver: bridge
    name: muse-network-dev

volumes:
  postgres_data:
    name: muse-music-postgres-data-dev
    driver: local
  minio_data:
    name: muse-music-minio-data-dev
    driver: local
  n8n_data:
    name: muse-music-n8n-data-dev
    driver: local
