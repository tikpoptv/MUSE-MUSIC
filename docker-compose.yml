version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "7661:3000"
    depends_on:
      - backend
    networks:
      - muse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7662:3001"
    networks:
      - muse-network

networks:
  muse-network:
    driver: bridge
