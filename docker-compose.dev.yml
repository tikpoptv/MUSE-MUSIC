version: '3.8'

services:
  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        BACKEND_PORT: 3001
    container_name: muse-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      BACKEND_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: muse_music
      DB_USER: postgres
      DB_PASSWORD: postgres123
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_secret_password
      MINIO_USE_SSL: false
      MINIO_BUCKET_NAME: muse-music
      MINIO_PUBLIC_URL: http://localhost:7771
      FRONTEND_URL: http://localhost:7664
      JWT_SECRET: muse-music-dev-jwt-secret-key-change-in-production
      JWT_ACCESS_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      YT_TRANSCRIPT_PYTHON: ./.transcript-venv/bin/python
      YT_TRANSCRIPT_LANGUAGES: th,en
      YT_TRANSCRIPT_PRESERVE: false
    ports:
      - "7665:3001"
    networks:
      - muse-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: http://localhost:7665
        NEXT_PUBLIC_NODE_ENV: production
        NEXT_PUBLIC_PORT: 3000
    container_name: muse-frontend-dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7665
      NODE_ENV: production
    ports:
      - "7664:3000"
    depends_on:
      - backend
    networks:
      - muse-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  muse-network:
    external: true
    name: muse-network-dev
