version: '3.8'

services:
  frontend:
    image: ${DOCKER_REGISTRY:-your-registry.com}/muse-music-frontend:${BUILD_NUMBER:-latest}
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.musemusic.phitik.com}
    restart: unless-stopped
    networks:
      - muse-network

  backend:
    image: ${DOCKER_REGISTRY:-your-registry.com}/muse-music-backend:${BUILD_NUMBER:-latest}
    ports:
      - "443:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-https://musemusic.phitik.com}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
    restart: unless-stopped
    networks:
      - muse-network

networks:
  muse-network:
    driver: bridge
